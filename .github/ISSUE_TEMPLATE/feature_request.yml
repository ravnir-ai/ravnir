name: Feature request
description: Describe a problem Ravnir could help you solve.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe your task and where the current behavior gets in the way.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a useful outcome look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
