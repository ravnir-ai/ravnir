<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ravnir character library</title>
  <link rel="stylesheet" href="../../public/app.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px; background: #f3f2ee; color: #27313a; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    main { max-width: 1320px; margin: auto; }
    .study-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 12px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #7b858c; }
    h1 { margin: 0 0 10px; font-size: 34px; font-weight: 500; letter-spacing: -1.3px; }
    .intro { margin: 0; color: #78838b; font-size: 13px; line-height: 1.6; }
    .study-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .study-controls label { display: flex; align-items: center; gap: 7px; color: #748089; font-size: 11px; }
    .study-controls select { width: auto; padding: 8px 25px 8px 10px; font-size: 11px; background-color: #fff; }
    .themes { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 20px; }
    .library-panel { min-width: 0; padding: 22px; background: #fff; border: 1px solid #e1e5e6; border-radius: 14px; --surface: #fff; }
    .library-panel.dark { background: #1b222b; color: #e0e4e5; border-color: #2c3540; --surface: #1b222b; }
    .library { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 26px 8px; }
    .character { display: flex; align-items: center; flex-direction: column; gap: 8px; min-width: 0; }
    .study-avatar { display: block; flex: none; position: relative; width: 84px; height: 84px; }
    .character-name { padding: 0; border: 0; background: transparent; font: inherit; font-size: 12px; color: inherit; cursor: pointer; }
    .character-name:hover { text-decoration: underline; text-underline-offset: 3px; }
    .small-row { display: flex; align-items: center; justify-content: center; gap: 10px; height: 30px; }
    .small-row .study-avatar { width: 28px; height: 28px; }
    .silhouette { filter: brightness(0); opacity: .85; }
    .silhouette .tb-av-glow, .silhouette .tb-av-shadow { display: none; }
    .silhouette .tb-av-svg * { fill-opacity: 1 !important; stroke-opacity: 1 !important; }
    .dark .silhouette { filter: brightness(0) invert(1); opacity: .75; }
    .library-note { margin: 22px 0 0; padding-top: 14px; border-top: 1px solid #7e899124; color: #7c8992; font-size: 10px; line-height: 1.5; }
    .team-panel { margin-top: 20px; padding: 20px 22px; background: #fff; border: 1px solid #e1e5e6; border-radius: 14px; }
    .team { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 12px 18px; }
    .team-agent { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .team-agent .study-avatar { width: 28px; height: 28px; }
    .team-copy { display: flex; flex-direction: column; gap: 3px; }
    .team-copy strong { font-size: 11px; font-weight: 500; }
    .team-copy small { font-size: 10px; color: #849098; }
    .study-footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 22px; }
    .study-footer p { margin: 0; color: #78838b; font-size: 12px; line-height: 1.6; }
    .study-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .study-actions button { flex: none; border: 0; padding: 10px 14px; background: #28323b; color: #fafaf7; border-radius: 7px; font: inherit; font-size: 11px; cursor: pointer; }
    @media(max-width:1050px) { body { padding: 28px; } .library-panel { padding: 18px; } .study-avatar { width: 70px; height: 70px; } .study-head { align-items: start; flex-direction: column; } }
    @media(max-width:750px) { body { padding: 24px 16px; } h1 { font-size: 29px; } .themes { grid-template-columns: 1fr; } .library { grid-template-columns: repeat(5,minmax(0,1fr)); gap: 20px 4px; } .study-avatar { width: 56px; height: 56px; } .character-name { font-size: 10px; } .small-row { gap: 2px; } .small-row .study-avatar { width: 24px; height: 24px; } .team { grid-template-columns: repeat(2,minmax(0,1fr)); } .study-footer { align-items: start; flex-direction: column; } }
    @media(max-width:370px) { .library { grid-template-columns: repeat(3,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <main>
    <header class="study-head">
      <div><p class="eyebrow">Ravnir · Character library</p><h1>Individual by design.</h1><p class="intro">Distinct shapes and colors. Considered materials. The same living personalities.</p></div>
      <div class="study-controls">
        <label>Status <select id="status"><option value="">Idle</option><option value="working">Working</option><option value="waiting">Needs you</option><option value="happy">Done</option><option value="sleeping">Paused</option><option value="speaking">Speaking</option></select></label>
        <label>Motion <select id="motion"><option value="full">Full</option><option value="subtle">Subtle</option><option value="off">Off</option></select></label>
      </div>
    </header>
    <div class="themes"></div>
    <section class="team-panel"><p class="eyebrow">A team at sidebar size</p><div class="team"></div></section>
    <footer class="study-footer"><p>Hover and tap a character. Select its name to customize it.<br>Choose a status to see the whole team respond.</p><div class="study-actions"><button id="hello" type="button">Say hello</button><button id="studio" type="button">Open the studio</button></div></footer>
  </main>
  <script src="../../public/avatar.js"></script>
  <script src="../../public/studio.js"></script>
  <script>
    const A = RavnirAvatar;
    const samples = [];
    const shapes = new Map(A.SHAPES);
    const presets = A.PRESETS.slice(0, 10);
    const looks = new Map(presets.map(([name]) => [name, A.preset(name)]));
    let mood = "";
    function addAvatar(host, look, name, options = {}) {
      const node = document.createElement("span");
      node.className = "study-avatar";
      host.append(node);
      A.render(node, look, { name, state: mood, ...options });
      return node;
    }
    function customize(name) {
      RavnirStudio.open({ look: looks.get(name), name, seed: name, onDone: (look) => {
        looks.set(name, look);
        for (const sample of samples.filter((item) => item.name === name)) {
          A.render(sample.node, look, { name, state: mood, ...sample.options });
          const title = sample.node.closest(".character")?.querySelector(".character-name");
          if (title) title.textContent = shapes.get(look.shape);
        }
      } });
    }
    for (const theme of ["light", "dark"]) {
      const panel = document.createElement("section");
      panel.className = "library-panel " + theme;
      panel.setAttribute("aria-label", theme + " background");
      panel.innerHTML = '<p class="eyebrow">' + theme + '</p><div class="library"></div><p class="library-note">Large view, sidebar view and body outline. Every existing shape, together.</p>';
      document.querySelector(".themes").append(panel);
      for (const [name] of presets) {
        const look = looks.get(name);
        const card = document.createElement("div");
        card.className = "character";
        panel.querySelector(".library").append(card);
        const hero = addAvatar(card, look, name);
        const title = document.createElement("button");
        title.type = "button";
        title.className = "character-name";
        title.textContent = shapes.get(look.shape);
        title.setAttribute("aria-label", "Customize " + name);
        title.addEventListener("click", () => customize(name));
        card.append(title);
        const small = document.createElement("div");
        small.className = "small-row";
        card.append(small);
        const sidebar = addAvatar(small, look, name);
        const outlineOptions = { face: false, mark: false, extras: false };
        const outline = addAvatar(small, look, name, outlineOptions);
        outline.classList.add("silhouette");
        samples.push({ node: hero, name, options: {} }, { node: sidebar, name, options: {} }, { node: outline, name, options: outlineOptions });
      }
    }
    for (const [name, label] of [["Chief of Staff", "Chief"], ["Engineer", "Engineering"], ["Researcher", "Research"], ["Head of Finance", "Finance"], ["Growth Coach", "Growth"], ["Inbox", "Communications"], ["Auditor", "Audit"], ["PA", "Assistant"], ["Job Hunter", "Job search"], ["Genius Bot", "Ideas"]]) {
      const look = A.suggest({ name });
      const row = document.createElement("div");
      row.className = "team-agent";
      document.querySelector(".team").append(row);
      addAvatar(row, look, name);
      const copy = document.createElement("div");
      copy.className = "team-copy";
      const title = document.createElement("strong");
      title.textContent = label;
      const sub = document.createElement("small");
      sub.textContent = shapes.get(look.shape);
      copy.append(title, sub);
      row.append(copy);
    }
    document.getElementById("motion").value = A.motion();
    document.getElementById("motion").addEventListener("change", (event) => A.setMotion(event.target.value));
    document.getElementById("status").addEventListener("change", (event) => {
      mood = event.target.value;
      for (const node of document.querySelectorAll("main .study-avatar")) A.setState(node, mood);
    });
    document.getElementById("hello").addEventListener("click", () => {
      for (const node of document.querySelectorAll(".character > .study-avatar")) node.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, button: 0, pointerType: "touch" }));
    });
    document.getElementById("studio").addEventListener("click", () => customize("Cobalt"));
  </script>
</body>
</html>
